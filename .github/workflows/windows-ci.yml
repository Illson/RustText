name: Windows CI

on:
  push:
    branches:
      - main
      - dev
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  avalonia:
    name: Windows .NET checks
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build Debug
        run: dotnet build RustText.slnx -c Debug --nologo

      - name: Run .NET regression tests
        run: dotnet test RustText.slnx -c Debug --no-build --nologo

      - name: Publish and check the standalone Native AOT executable
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'rusttext-win-x64'
          dotnet publish src/RustText/RustText.csproj -c Release -r win-x64 -o $output --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $files = @(Get-ChildItem -LiteralPath $output -Force)
          if ($files.Count -ne 1 -or $files[0].Name -cne 'rusttext.exe' -or $files[0].PSIsContainer) {
            throw 'The publish directory must contain exactly one rusttext.exe.'
          }

          $stream = [IO.File]::OpenRead($files[0].FullName)
          $reader = [System.Reflection.PortableExecutable.PEReader]::new($stream)
          try {
            $headers = $reader.PEHeaders
            if ($headers.CoffHeader.Machine -ne 'Amd64' -or $headers.CorHeader) {
              throw 'rusttext.exe must be a native Windows x64 executable.'
            }
          } finally {
            $reader.Dispose()
          }

          ./tools/Package-RustText.ps1 -Executable $files[0].FullName -OutputDirectory (Join-Path $env:RUNNER_TEMP 'rusttext-release-packages')

          $managedInput = Resolve-Path -LiteralPath 'src/RustText/obj/Release/net11.0/win-x64/rusttext.dll'
          $reader = [System.Reflection.PortableExecutable.PEReader]::new([IO.File]::OpenRead($managedInput.Path))
          try {
            $metadata = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader($reader, 0, $null)
            $resources = @(foreach ($handle in $metadata.ManifestResources) {
              $metadata.GetString($metadata.GetManifestResource($handle).Name)
            })
            foreach ($name in 'av_libglesv2.dll', 'libHarfBuzzSharp.dll', 'libSkiaSharp.dll') {
              if ($resources -cnotcontains "RustText.Demo.NativePayload.$name") {
                throw "Missing embedded resource $name in the Native AOT compilation input."
              }
            }
          } finally {
            $reader.Dispose()
          }

      - name: Check capture from a classic Windows console
        run: python tests/windows/console_capture.py (Join-Path $env:RUNNER_TEMP 'rusttext-win-x64/rusttext.exe')

      - name: Validate performance harness without GUI or timing thresholds
        run: |
          ./tests/windows/performance_readiness.ps1
          $run = Join-Path $env:RUNNER_TEMP 'rusttext-performance'
          ./tools/Measure-RustTextPerformance.ps1 -BaselineRef HEAD -CoreOnly -Smoke -Iterations 2 -OutputDirectory $run
          $rendered = Join-Path $run 'rendered.md'
          ./tools/Measure-RustTextPerformance.ps1 -RenderFromRawJson -RawJsonPath (Join-Path $run 'raw.json') -ReportPath $rendered
          if ((Get-FileHash $rendered).Hash -ne (Get-FileHash (Join-Path $run 'report.md')).Hash) {
            throw 'Re-rendered performance report differs from the original.'
          }
          if (Test-Path (Join-Path $run 'work')) {
            throw 'Performance harness left temporary files behind.'
          }

      - name: Upload Windows preview
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RustText-win-x64-${{ github.sha }}
          path: ${{ runner.temp }}/rusttext-win-x64/rusttext.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
