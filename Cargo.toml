[package]
name = "rusttext"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "=0.10.0", features = ["syntect"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
crc32fast = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0
