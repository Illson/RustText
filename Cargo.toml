[package]
name = "rusttext"
version = "0.2.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "=0.10.0", features = ["syntect"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
tempfile = "3"
semver = "1"
sha2 = "0.11"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "json"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-base = { git = "https://github.com/TheVSAKeeper/gpui-kit", rev = "d832f0d5daf3f60d2262880d482170cf974336c1" }
